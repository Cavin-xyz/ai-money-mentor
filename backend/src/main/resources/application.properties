server.port=8080
# Serve the built React app from the same origin (run `npm run build` in frontend/ first)
spring.web.resources.static-locations=classpath:/static/,file:../frontend/dist/
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Local LLM (Ollama) ─────────────────────────────────────────────
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.5:4b
spring.ai.ollama.chat.temperature=0.2
# Default is 2048, which silently truncates retrieved sources
spring.ai.ollama.chat.num-ctx=8192
# Reasoning traces are on by default for qwen3.5; they slow every explanation down
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.keep-alive=1h
# Offload every layer to the GPU: measured 51 tok/s vs 16 tok/s with Ollama's default
# 48% GPU split on the RTX 3050 Ti (4 GB). Lower this if the GPU runs out of memory.
spring.ai.ollama.chat.num-gpu=99
# bge-m3 copy pinned to CPU (num_gpu 0) so the chat model keeps the 4 GB GPU
spring.ai.ollama.embedding.model=bge-m3-cpu
spring.ai.ollama.embedding.keep-alive=1h

# ── Vector database (Qdrant, native binary, gRPC port) ──────────────
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=mentor_knowledge
spring.ai.vectorstore.qdrant.initialize-schema=true

# ── Persistent user memory + rules + keyword index (SQLite) ─────────
spring.datasource.url=jdbc:sqlite:${mentor.data-dir}/mentor.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ── App ─────────────────────────────────────────────────────────────
mentor.data-dir=../data
mentor.knowledge-dir=knowledge
mentor.default-tax-year=2026-27
# Structured-output modules can use a smaller model if the 4B one is too slow
mentor.llm.structured-model=qwen3.5:4b
# Full-shape JSON (checkpoint A) needs room; narrative-only calls pass a smaller limit
mentor.llm.max-output-tokens=2000

# Accounts. Locally the demo stays usable without signing in (guest profile in the browser);
# a deployment sets auth.required=true and serves over HTTPS with secure-cookie=true.
mentor.auth.required=false
mentor.auth.secure-cookie=false
